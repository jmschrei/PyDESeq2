name: Test

# Fork-only copy for ci-os/* branches: the upstream test job on Linux, Windows
# and macOS, each with the resolved dependencies and with pandas<3.1 pinned.
# Codecov upload is left out (no token on the fork).
on:
  push:
    branches: ["ci-os/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  get-environments:
    runs-on: ubuntu-slim
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Get test environments
        id: get-envs
        run: |
          ENVS_JSON=$(uvx hatch env show --json | jq -c 'to_entries
            | map(
                select(.key | startswith("hatch-test"))
                | {
                    name: .key,
                    label: (if (.key | contains("pre")) then .key + " (PRE-RELEASE DEPENDENCIES)" else .key end),
                    python: .value.python
                  }
              )')
          echo "envs=${ENVS_JSON}" | tee $GITHUB_OUTPUT

  test:
    needs: get-environments
    permissions:
       contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        env: ${{ fromJSON(needs.get-environments.outputs.envs) }}
        pandas:
          - {name: as-resolved, pin: ""}
          # A requirements file: hatch runs commands through cmd.exe on Windows,
          # which reads the "<" of pandas<3.1 as a redirection.
          - {name: pandas-lt-3.1, pin: .github/ci-os/pandas-lt-3.1.txt}

    name: ${{ matrix.os }} | ${{ matrix.env.label }} | ${{ matrix.pandas.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ contains(matrix.env.name, 'pre') }}  # make "all-green" pass even if pre-release job fails

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.env.python }}
      - name: create hatch environment
        run: uvx hatch env create ${{ matrix.env.name }}
      - name: pin pandas<3.1
        if: matrix.pandas.pin != ''
        run: uvx hatch run ${{ matrix.env.name }}:uv pip install -r ${{ matrix.pandas.pin }}
      - name: list all all installed package versions
        run: uvx hatch run ${{ matrix.env.name }}:uv pip list
      - name: pydeseq2 folders in joblib's temporary folder before the tests
        run: uvx hatch run ${{ matrix.env.name }}:python .github/ci-os/leftovers.py --label before --out leftovers-before.json
      - name: run tests using hatch
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        run: uvx hatch run ${{ matrix.env.name }}:run-cov -v --color=yes -n auto --junitxml=junit.xml
      - name: pydeseq2 folders left in joblib's temporary folder after the tests
        if: always()
        run: uvx hatch run ${{ matrix.env.name }}:python .github/ci-os/leftovers.py --label after --out leftovers-after.json
      - name: generate coverage report
        shell: bash
        run: |
          # See https://coverage.readthedocs.io/page/config.html#run-patch
          test -f .coverage || uvx hatch run ${{ matrix.env.name }}:cov-combine
          uvx hatch run ${{ matrix.env.name }}:cov-report   # report visibly
          uvx hatch run ${{ matrix.env.name }}:coverage xml # create report for upload
      - name: upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ matrix.env.name }}-${{ matrix.pandas.name }}
          path: |
            junit.xml
            leftovers-before.json
            leftovers-after.json
          if-no-files-found: warn

  check:
    name: Tests pass in all hatch environments
    if: always()
    needs:
      - get-environments
      - test
    runs-on: ubuntu-latest
    steps:
        - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
          with:
            jobs: ${{ toJSON(needs) }}
